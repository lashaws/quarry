appId: dev.quarry.app
productName: Quarry
copyright: Copyright © 2026 Quarry contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# The Amazon RDS global CA bundle, so verify-full can check an RDS instance
# certificate. Node's default trust store does not carry the regional RDS roots.
extraResources:
  - from: resources/rds-global-bundle.pem
    to: rds-global-bundle.pem

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned builds are fine for local use; see README for the Gatekeeper note.
  identity: null
  darkModeSupport: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Development
  target: [AppImage]

win:
  icon: build/icon.png
  target: [nsis]
